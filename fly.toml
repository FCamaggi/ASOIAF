# Fly.io config — single container: Fastify serves the API and the built SPA.
# Change `app` to a globally-unique name before `fly deploy`.
app = "asoiaf-trend"
primary_region = "gru"

[build]

[env]
  PORT = "3001"
  DATA_DIR = "/data"
  UPLOAD_DIR = "/data/uploads"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"

# Persistent volume — votes (data/db.json) and uploaded images survive restarts.
# Create it once:  fly volumes create asoiaf_data --region gru --size 1
[[mounts]]
  source = "asoiaf_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
