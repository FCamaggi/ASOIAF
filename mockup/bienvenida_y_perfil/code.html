<script>
    document.addEventListener('DOMContentLoaded', () => {
        const cards = document.querySelectorAll('.profile-card');
        
        cards.forEach(card => {
            card.addEventListener('click', () => {
                // Reset all cards
                cards.forEach(c => {
                    c.classList.remove('shadow-[inset_0_0_0_1px_#FFD700]', 'bg-surface-container-high');
                    c.classList.add('bg-surface-container');
                    
                    const avatar = c.querySelector('.avatar-circle');
                    avatar.classList.remove('shadow-[0_0_16px_rgba(255,215,0,0.15)]', 'bg-surface');
                    avatar.classList.add('bg-surface-dim');
                    
                    const icon = c.querySelector('.icon');
                    icon.classList.remove('text-dragon-gold');
                    icon.classList.add('text-valyrian-steel');
                });
                
                // Set active state on clicked card
                card.classList.remove('bg-surface-container');
                card.classList.add('shadow-[inset_0_0_0_1px_#FFD700]', 'bg-surface-container-high');
                
                const activeAvatar = card.querySelector('.avatar-circle');
                activeAvatar.classList.remove('bg-surface-dim');
                activeAvatar.classList.add('shadow-[0_0_16px_rgba(255,215,0,0.15)]', 'bg-surface');
                
                const activeIcon = card.querySelector('.icon');
                activeIcon.classList.remove('text-valyrian-steel');
                activeIcon.classList.add('text-dragon-gold');
            });
        });
    });
