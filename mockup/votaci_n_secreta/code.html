                    const glow = this.querySelector('.selection-glow');
                    const check = this.querySelector('.selection-check');
                    
                    glow.classList.remove('opacity-0', 'scale-95');
                    glow.classList.add('opacity-100', 'scale-100');
                    
                    check.classList.remove('opacity-0', 'scale-50');
                    check.classList.add('opacity-100', 'scale-100');
                });
            });

            // Simple search filter
            const searchInput = document.getElementById('houseSearch');
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                options.forEach(option => {
                    const houseName = option.querySelector('h3').textContent.toLowerCase();
                    if (houseName.includes(term)) {
                        option.style.display = 'block';
                    } else {
                        option.style.display = 'none';
                    }
                });
            });
        });
    </script>
