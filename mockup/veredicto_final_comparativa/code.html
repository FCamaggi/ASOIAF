<script>
    document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('verdict-container');
        
        // Add a subtle parallax effect on mouse move if on desktop
        if (window.matchMedia("(pointer: fine)").matches) {
            container.addEventListener('mousemove', (e) => {
                const rect = container.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const moveX = (x - centerX) / 50;
                const moveY = (y - centerY) / 50;
                
                const grid = container.querySelector('.max-w-\\[600px\\]');
                if(grid) {
                    grid.style.transform = `perspective(1000px) rotateY(${moveX}deg) rotateX(${-moveY}deg)`;
                }
            });

            container.addEventListener('mouseleave', () => {
                 const grid = container.querySelector('.max-w-\\[600px\\]');
                 if(grid) {
                    grid.style.transform = `perspective(1000px) rotateY(0deg) rotateX(0deg)`;
                    grid.style.transition = 'transform 0.5s ease-out';
                 }
            });
            
             container.addEventListener('mouseenter', () => {
                 const grid = container.querySelector('.max-w-\\[600px\\]');
                 if(grid) {
                    grid.style.transition = 'none';
                 }
            });
        }
    });
