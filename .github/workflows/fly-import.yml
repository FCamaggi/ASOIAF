name: Fly Import (catálogo externo)

# Ejecuta `npm run import` DENTRO de la máquina en Fly (AIOIAF + AWOIAF).
# Disparalo a mano desde la pestaña Actions cuando quieras ampliar el canon.
on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl ssh console -a asoiaf-trend --command "npm run import"
