name: Fly Status (diagnóstico)

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: asoiaf-trend
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: status / ips / volumes
        run: |
          flyctl status -a "$FLY_APP" || true
          flyctl ips list -a "$FLY_APP" || true
          flyctl volumes list -a "$FLY_APP" || true

      - name: logs recientes
        run: flyctl logs -a "$FLY_APP" --no-tail | tail -n 120 || true

      - name: contenido del contenedor
        run: |
          flyctl ssh console -a "$FLY_APP" -C "sh -lc 'echo PWD=\$(pwd); ls -la /app; echo ---; ls -la /app/dist; echo ---; ls -la /app/dist/assets'" || true

      - name: HTTP — root + asset + api
        run: |
          BASE="https://$FLY_APP.fly.dev"
          echo "### GET /"
          curl -sS -m 20 -D - -o /tmp/root.html "$BASE/" | head -20
          echo; echo "### asset referenciado en el HTML:"
          ASSET=$(grep -oE '/assets/[A-Za-z0-9_.-]+\.js' /tmp/root.html | head -1)
          echo "ASSET=$ASSET"
          echo "### GET $ASSET (headers + primeras líneas)"
          curl -sS -m 20 -D - -o /tmp/app.js "$BASE$ASSET" | head -15
          echo "--- body head ---"; head -c 300 /tmp/app.js; echo
          echo; echo "### GET /api/categories (primeros 400 chars)"
          curl -sS -m 20 "$BASE/api/categories" | head -c 400; echo
