name: Fly Deploy

# Todo corre en runners de GitHub (que llegan a api.fly.io).
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLY_APP: asoiaf-trend
  FLY_REGION: gru          # São Paulo. Alternativas si falla por capacidad: gig, bog, mia
  FLY_VOLUME: asoiaf_data

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: App
        run: flyctl apps list | grep -qw "$FLY_APP" || flyctl apps create "$FLY_APP" --org personal

      - name: Volumen en $FLY_REGION
        run: |
          for v in $(flyctl volumes list -a "$FLY_APP" --json | jq -r --arg r "$FLY_REGION" '.[] | select(.region != $r) | .id // empty'); do
            flyctl volumes destroy "$v" -a "$FLY_APP" --yes || true
          done
          COUNT=$(flyctl volumes list -a "$FLY_APP" --json | jq -r --arg r "$FLY_REGION" '[.[] | select(.region == $r)] | length')
          [ "${COUNT:-0}" -ge 1 ] || flyctl volumes create "$FLY_VOLUME" -a "$FLY_APP" --region "$FLY_REGION" --size 1 --yes

      - name: IPs
        run: |
          flyctl ips allocate-v4 --shared -a "$FLY_APP" || true
          flyctl ips allocate-v6 -a "$FLY_APP" || true

      - name: Deploy (retry con recreación si el host está lleno)
        run: |
          set -o pipefail
          if flyctl deploy --remote-only --ha=false -a "$FLY_APP"; then
            exit 0
          fi
          echo "::warning::deploy falló — destruyo máquinas y reintento en un host limpio"
          for m in $(flyctl machine list -a "$FLY_APP" --json | jq -r '.[].id // empty'); do
            flyctl machine destroy "$m" -a "$FLY_APP" --force || true
          done
          flyctl deploy --remote-only --ha=false -a "$FLY_APP"

      - name: Asegurar máquina encendida
        run: |
          for m in $(flyctl machine list -a "$FLY_APP" --json | jq -r '.[] | select(.state != "started") | .id // empty'); do
            flyctl machine start "$m" -a "$FLY_APP" || true
          done
          curl -sS -m 40 -o /dev/null "https://$FLY_APP.fly.dev/api/health" || true
          sleep 8
          flyctl status -a "$FLY_APP" || true

      - name: Import catálogo completo + imágenes
        # AIOIAF (todos los personajes/casas) + AWOIAF (dragones/batallas/lugares)
        # + ThronesAPI/Commons. Idempotente; el seed (merge) lo conserva entre deploys.
        run: |
          flyctl ssh console -a "$FLY_APP" --command "npm run import" \
            || echo "::warning::import falló — queda el catálogo curado"
