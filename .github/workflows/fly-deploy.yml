name: Fly Deploy

# Todo corre en runners de GitHub (que llegan a api.fly.io).
# Estrategia: destruir la máquina y recrearla en cada deploy. Evita el error
# "insufficient CPUs on the current host" (update in-place sobre un host lleno).
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLY_APP: asoiaf-trend
  FLY_REGION: gru          # São Paulo (probado OK para esta org). Alternativas: gig, bog, mia
  FLY_VOLUME: asoiaf_data

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Crear la app si no existe
        run: flyctl apps list | grep -qw "$FLY_APP" || flyctl apps create "$FLY_APP" --org personal

      - name: Destruir máquinas existentes (recreación limpia)
        run: |
          for m in $(flyctl machine list -a "$FLY_APP" --json | jq -r '.[].id // empty'); do
            echo "destruyendo $m"
            flyctl machine destroy "$m" -a "$FLY_APP" --force || true
          done

      - name: Volumen en $FLY_REGION
        run: |
          # borrar volúmenes en otra región (p.ej. gru viejo)
          for v in $(flyctl volumes list -a "$FLY_APP" --json | jq -r --arg r "$FLY_REGION" '.[] | select(.region != $r) | .id // empty'); do
            echo "borrando volumen fuera de región: $v"
            flyctl volumes destroy "$v" -a "$FLY_APP" --yes || true
          done
          COUNT=$(flyctl volumes list -a "$FLY_APP" --json | jq -r --arg r "$FLY_REGION" '[.[] | select(.region == $r)] | length')
          if [ "${COUNT:-0}" -lt 1 ]; then
            flyctl volumes create "$FLY_VOLUME" -a "$FLY_APP" --region "$FLY_REGION" --size 1 --yes
          fi
          flyctl volumes list -a "$FLY_APP"

      - name: Asignar IPs públicas si faltan
        run: |
          flyctl ips allocate-v4 --shared -a "$FLY_APP" || true
          flyctl ips allocate-v6 -a "$FLY_APP" || true
          flyctl ips list -a "$FLY_APP"

      - name: Deploy
        run: flyctl deploy --remote-only --ha=false -a "$FLY_APP"

      - name: Estado final
        if: always()
        run: |
          flyctl status -a "$FLY_APP" || true
          flyctl ips list -a "$FLY_APP" || true
